# plumbsearch.org: the website, and optionally a Plumb node behind it.
#
#   docker compose up -d                   # website only
#   docker compose --profile node up -d    # website and Plumb node
#
# README.md in this folder covers setup and updates.
services:
  caddy:
    image: caddy:2
    # Host networking, so Caddy can reach the node on 127.0.0.1:8080 and the
    # host firewall (ufw) applies to ports 80 and 443 as usual.
    network_mode: host
    # This whole folder, rather than the Caddyfile alone: a file mounted by
    # itself keeps its old contents after `git pull` replaces it.
    command: ["caddy", "run", "--config", "/site/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - .:/site:ro
      # Certificates and the ACME account. Keep this volume, or Caddy has to
      # request new certificates and can run into Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  plumb:
    profiles: ["node"]
    # `main` is the newest build of the main branch; `latest` is the newest
    # release.
    image: ghcr.io/sueheir/plumb-search:main
    # Used by `docker compose --profile node build`, for when the image isn't
    # published yet or you want another branch. PLUMB_SOURCE is a Git URL with
    # an optional #branch, set in .env next to this file.
    build: ${PLUMB_SOURCE:-https://github.com/SueHeir/plumb-search.git#main}
    # The image's default command plus private search (/private) and search
    # by meaning: the node downloads a small embedding model into /data/model
    # and embeds sites in the background, best-ranked first. It crawls at the
    # server default, 5,000 homepages every hour.
    # It is in the Plumb network on port 4002 (plumb-relay on this machine has
    # 4001), so private searches can be relayed to other nodes and the
    # visitor's address stays hidden from them. It joins through plumb-relay,
    # reached via the Docker host since a container can't reach this
    # machine's own public address; the peer id is plumb-relay's key.
    command:
      - run
      - --data
      - /data
      - --bind
      - 0.0.0.0:8080
      - --private-search
      - --search-by-meaning
      # One embedding thread: with 2.5 million sites the node rebuilds its
      # index often and shares the box with the relay, and three threads
      # left searches waiting behind the embed.
      - --embed-threads
      - "1"
      - --network
      - --p2p-port
      - "4002"
      - --public-addr
      - /ip4/198.211.114.63/tcp/4002
      - --public-addr
      - /ip4/198.211.114.63/udp/4002/quic-v1
      - --bootstrap
      - /dns4/host.docker.internal/tcp/4001/p2p/12D3KooWJ2UWUBsxmPfXTfHa8cBBmzifa6kj5pFZKfJXYNQyJ69a
      # Not the default plumbsearch.org addresses, for the same reason.
      - --no-default-bootstrap
      - --no-upnp
      - --no-local-discovery
      # The public page's network searches may ask any node, not only
      # trusted ones and the nodes they trust (2026-10-05).
      - --search-from
      - anyone
      # The search pages start with the United States, only its sites and
      # English, whatever the browser's language; the settings gear still
      # changes them (Liz, 2026-10-09). AI apps still get every country.
      - --country
      - US
      - --only-country
      - --lang
      - en
      # Sites no crawl has reached for 60 days, after 6 unanswered tries in
      # a row, leave the index; they come back if they answer again (Liz
      # OK'd it 2026-10-06).
      - --drop-dead-sites
      # Page set and map files change here only by hand for now, and sets
      # this node has no file of are not taken: this
      # machine has under 8 GB, and a much bigger set (hpc's 6.8 million
      # Wikipedia pages) would not fit next to the node (2026-10-09).
      - --set-updates
      - "off"
      # Crawls from trusted nodes run by the project count as soon as they're
      # signed, without waiting for a second crawler; the first is plumb-relay
      # on this machine.
      - --trust-peer
      - 12D3KooWJ2UWUBsxmPfXTfHa8cBBmzifa6kj5pFZKfJXYNQyJ69a
      - --trust-peer
      - 12D3KooWDegojQ9GFofEwymecV8NzzwEN8oWbgd9mFaPjHkZJ6wb
      - --trust-peer
      - 12D3KooWDHxYtCdqrfk6QM21uNnSYcg38K18rDE4hPv71HKQGUxT
      - --trust-peer
      - 12D3KooWNhgFVypWynFp9M88SLwQ1dhWWWrRhm6XvhyVnrEZ9pEV
      - --trust-peer
      - 12D3KooWCYcc2SRFfexFAzaGAA6bQero99ZRXLEraPU2V4PtSE7R
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The web port is only reachable from this machine; Caddy serves it to
    # the world. The network port is public (Docker opens it itself).
    ports:
      - "127.0.0.1:8080:8080"
      - "4002:4002/tcp"
      - "4002:4002/udp"
    volumes:
      - plumb-data:/data
    # 3 of the droplet's 4 vCPUs (8 GB since 2026-10-04): leaves one for
    # Caddy and the relay while sites are being embedded.
    cpus: 3
    init: true
    restart: unless-stopped
    stop_grace_period: 5m

volumes:
  caddy-data:
  caddy-config:
  plumb-data:
    name: plumb-data
