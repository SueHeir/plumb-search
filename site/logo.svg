<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Plumb Search</title>
  <!--
    The Plumb Search mark: a brass plumb bob hanging from its line, on a blue
    tile. It is the desktop app's icon redrawn without the margin around the
    tile, so it fills a browser tab. The site uses it as both the logo and the
    favicon. Plain shapes and attributes only, no <style>, so it also works
    under the site's Content-Security-Policy.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c5aa0"/>
      <stop offset="1" stop-color="#183a6d"/>
    </linearGradient>
    <linearGradient id="brass" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#f0b43c"/>
      <stop offset="1" stop-color="#c7841f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14.29" fill="url(#tile)"/>
  <!-- The line, hanging from the top edge -->
  <rect x="29.71" width="4.57" height="18.57" fill="#eef2f7"/>
  <!-- The weight: a circle with tangents meeting at the tip -->
  <path d="M32 60.79 44.02 42.08A14.29 14.29 0 1 0 19.98 42.08Z" fill="url(#brass)"/>
  <!-- The cap the line is tied to -->
  <rect x="27.29" y="17.57" width="9.43" height="4.14" rx="1.14" fill="#b87a1e"/>
  <!-- Highlight -->
  <ellipse cx="27" cy="29.57" rx="3.29" ry="6.71" transform="rotate(25 27 29.57)" fill="#fff" fill-opacity="0.35"/>
</svg>
