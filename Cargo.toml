[workspace]
resolver = "2"
members = [
    "crates/plumb-core",
    "crates/plumb-format",
    "crates/plumb-answer",
    "crates/plumb-ingest",
    "crates/plumb-crawl",
    "crates/plumb-index",
    "crates/plumb-embed",
    "crates/plumb-net",
    "crates/plumb-node",
    "crates/plumb-tools",
    "crates/plumb-private",
    "crates/plumb-e2e",
    "crates/plumb-desktop",
    "crates/plumb-plugin",
    "plugins/hacker-news",
    "plugins/github",
    "plugins/reddit",
    "plugins/steam",
    "plugins/youtube-music",
    "plugins/zotero",
]
# Plain `cargo build` and `cargo test` leave out the desktop app, which needs
# GUI libraries (WebKitGTK on Linux); build it with `-p plumb-desktop`.
default-members = [
    "crates/plumb-core",
    "crates/plumb-format",
    "crates/plumb-answer",
    "crates/plumb-ingest",
    "crates/plumb-crawl",
    "crates/plumb-index",
    "crates/plumb-embed",
    "crates/plumb-net",
    "crates/plumb-node",
    "crates/plumb-tools",
    "crates/plumb-private",
    "crates/plumb-e2e",
    "crates/plumb-plugin",
    "plugins/hacker-news",
    "plugins/github",
    "plugins/reddit",
    "plugins/steam",
    "plugins/youtube-music",
    "plugins/zotero",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SueHeir/plumb-search"

# Debug builds, and so tests, are lightly optimized: the network replay
# tests push hundreds of MB through signing, JSON, text normalizing and
# records folds, and unoptimized they took a quarter of an hour and timed
# out in CI. Debug assertions and overflow checks stay on. Not 2 or 3:
# there wasmi switches to tail-call dispatch, which overflows the stack when
# debug assertions are on.
[profile.dev]
opt-level = 1

# The private search page's WebAssembly (crates/plumb-private), built small
# because every visitor downloads it: `--profile wasm`.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
