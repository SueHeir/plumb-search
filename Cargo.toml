[workspace]
resolver = "2"
members = [
    "crates/plumb-core",
    "crates/plumb-ingest",
    "crates/plumb-crawl",
    "crates/plumb-index",
    "crates/plumb-node",
    "crates/plumb-embed",
    "crates/plumb-desktop",
]
# Plain `cargo build` and `cargo test` leave out the desktop app, which needs
# GUI libraries (WebKitGTK on Linux); build it with `-p plumb-desktop`. The
# embedding prototype downloads ONNX Runtime; build it with `-p plumb-embed`.
default-members = [
    "crates/plumb-core",
    "crates/plumb-ingest",
    "crates/plumb-crawl",
    "crates/plumb-index",
    "crates/plumb-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SueHeir/plumb-search"
