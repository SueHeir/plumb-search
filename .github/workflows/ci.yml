name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs for main queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'SueHeir/plumb-search' && github.event.pull_request.head.ref == 'codex/frozen12-ci-package' && github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned to a commit, the action cannot read the toolchain from its ref.
          toolchain: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'SueHeir/plumb-search' && github.event.pull_request.head.ref == 'codex/frozen12-ci-package' && '1.96.1' || 'stable' }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      # The desktop app needs GUI libraries; the desktop job checks it.
      - run: cargo clippy --workspace --exclude plumb-desktop --all-targets -- -D warnings
      - name: Test frozen12 in-process adapter with tiny synthetic indexes
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'SueHeir/plumb-search' && github.event.pull_request.head.ref == 'codex/frozen12-ci-package') }}
        run: cargo test --locked -p plumb-node --example frozen12 -- --test-threads=1
      - name: Verify combined fixed12 fixtures and prepare audited public executables
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'SueHeir/plumb-search' && github.event.pull_request.head.ref == 'codex/frozen12-ci-package' }}
        timeout-minutes: 65
        env:
          FROZEN12_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/frozen12_ci_package.py
      - name: Upload exact audited fixed12 executable and attestation files
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'SueHeir/plumb-search' && github.event.pull_request.head.ref == 'codex/frozen12-ci-package' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen12-public-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/frozen12-ci-artifact/baseline-frozen12
            target/frozen12-ci-artifact/candidate-frozen12
            target/frozen12-ci-artifact/attestation.json
            target/frozen12-ci-artifact/SHA256SUMS
            target/frozen12-ci-artifact/allowlist-audit.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
          overwrite: false
      - run: cargo test --workspace --exclude plumb-desktop

  # Every third-party crate's license is one about.toml accepts, and the
  # notices that ship with the image and the installers can be written.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep in step with the Dockerfile and the Desktop workflow.
      - run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - run: cargo about generate --locked --workspace --fail -o THIRD-PARTY-NOTICES.html about.hbs

  # Research dependencies stay outside the shipped application's workspace.
  # Exercise only the small synthetic profile in CI; the full profile uses 4 GiB.
  pir-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned to a commit, the action cannot read the toolchain from its ref.
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/pir-probe
      - run: cargo fmt --manifest-path tools/pir-probe/Cargo.toml --check
      - run: cargo clippy --release --locked --manifest-path tools/pir-probe/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --release --locked --manifest-path tools/pir-probe/Cargo.toml

  # The private search page's WebAssembly: it builds, passes clippy, and
  # wasm-bindgen of the pinned version can read it.
  private-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned to a commit, the action cannot read the toolchain from its ref.
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install wasm-bindgen-cli --version 0.2.108 --locked
      - run: cargo clippy -p plumb-private --target wasm32-unknown-unknown -- -D warnings
      # The plugins in plugins/, as a node runs them.
      - run: cargo clippy -p plumb-plugin -p plumb-plugin-hacker-news -p plumb-plugin-youtube-music -p plumb-plugin-reddit -p plumb-plugin-github -p plumb-plugin-steam --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build --locked --release -p plumb-plugin-hacker-news -p plumb-plugin-youtube-music -p plumb-plugin-reddit -p plumb-plugin-github -p plumb-plugin-steam --target wasm32-unknown-unknown
      - run: cargo build --locked -p plumb-private --target wasm32-unknown-unknown --profile wasm
      - run: >-
          wasm-bindgen --target web --no-typescript --out-dir target/private
          target/wasm32-unknown-unknown/wasm/plumb_private.wasm
      # The node's tests again, now with the page's script built in.
      - run: cargo test -p plumb-node private
        env:
          PLUMB_PRIVATE_DIR: ../../target/private

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # WebKitGTK's dev package brings GTK, libsoup and D-Bus headers with it.
      - name: Install the GUI libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned to a commit, the action cannot read the toolchain from its ref.
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy -p plumb-desktop --all-targets -- -D warnings
      - run: cargo test -p plumb-desktop
