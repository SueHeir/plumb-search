# End-to-end tests of the Docker image (crates/plumb-e2e): a node whose
# setup is killed again and again, and two nodes exchanging crawls and
# answering each other's searches. Each test runs first on the synthetic
# fixtures, then with real data: the Tranco list, Wikidata, the embedding
# model and real homepages, as a node's first start does. The real run
# depends on those sites answering, so this workflow is not a required check.
name: End to end

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    name: ${{ matrix.test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        test:
          - setup_survives_being_killed
          - two_nodes_exchange_crawls_and_searches
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The same cache as the Docker image workflow's pull request build.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: plumb-search:e2e
          cache-from: type=gha,scope=linux-amd64

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned to a commit, the action cannot read the toolchain from its ref.
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e

      - name: With the fixtures
        env:
          PLUMB_E2E_IMAGE: plumb-search:e2e
        run: >-
          cargo test --locked -p plumb-e2e --test docker --
          --ignored --exact --nocapture ${{ matrix.test }}

      - name: With real data
        env:
          PLUMB_E2E_IMAGE: plumb-search:e2e
          PLUMB_E2E_REAL: "1"
        run: >-
          cargo test --locked -p plumb-e2e --test docker --
          --ignored --exact --nocapture ${{ matrix.test }}
