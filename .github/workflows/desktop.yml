name: Desktop

# Builds the desktop app's installers. Each run uploads them as artifacts
# (plumb-search-linux-x86_64, plumb-search-windows-x64 and
# plumb-search-macos-universal) and the third-party notices; a v* tag also
# attaches them to a draft release. The builds are not code-signed yet;
# docs/desktop.md explains how to open them anyway.

# Pull requests build the installers only when they touch the desktop app:
# three installer builds (macOS and Windows take half an hour) for every pull
# request filled the account's runners and left main's CI queued for an
# hour. The CI workflow's desktop job still checks the app's code on every
# pull request.
on:
  pull_request:
    paths:
      - "crates/plumb-desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  push:
    tags: ["v*"]

# A newer run for the same branch, pull request or tag replaces one in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the tauri crate in crates/plumb-desktop/Cargo.toml.
  TAURI_CLI_VERSION: "2.12.1"
  # Keep in step with the Dockerfile and the CI workflow's licenses job.
  CARGO_ABOUT_VERSION: "0.9.2"

jobs:
  # A v* tag must name the version in Cargo.toml, which the installers take
  # as theirs. Runs every time so the builds can depend on it; only tags are
  # checked.
  version:
    name: Check the tag's version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.ref_type == 'tag'
      - name: Compare the tag with Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [[ ${GITHUB_REF_NAME#v} != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version \"$version\" in Cargo.toml"
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the AppImage runs on older distros too.
          - name: linux
            runner: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            artifact: plumb-search-linux-x86_64
            files: target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage
          - name: windows
            runner: windows-latest
            args: --bundles nsis,msi
            artifact: plumb-search-windows-x64
            files: target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi
          # One app for both Apple silicon and Intel Macs.
          - name: macos
            runner: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            artifact: plumb-search-macos-universal
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned to a commit, the action cannot read the toolchain from its ref.
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-${{ matrix.name }}

      - name: Cache tauri-cli
        id: tauri-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install tauri-cli
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Build private browser search
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.108 --locked
          cargo build --locked -p plumb-private --target wasm32-unknown-unknown --profile wasm
          wasm-bindgen --target web --no-typescript --out-dir target/private target/wasm32-unknown-unknown/wasm/plumb_private.wasm

      - name: Build the installers
        working-directory: crates/plumb-desktop
        env:
          # aws-lc-sys, the crypto behind rustls, assembles its Windows code
          # with NASM; where NASM is missing, use the objects it ships instead.
          AWS_LC_SYS_PREBUILT_NASM: "1"
        run: cargo tauri build ${{ matrix.args }}

      # Tauri names the installers after the product ("Plumb Search_0.1.0_...");
      # without the space they are easier to type, and release assets keep
      # their names. A pattern that matches nothing fails the step.
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p dist
          for file in ${{ matrix.files }}; do
            name=$(basename "$file")
            cp "$file" "dist/${name/Plumb Search/plumb-search}"
          done
          ls -l dist

      - name: Upload the installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  # The licenses and notices of the third-party crates built into the app
  # (about.toml), attached to the release next to the installers.
  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install cargo-about
        run: cargo install cargo-about --version "${{ env.CARGO_ABOUT_VERSION }}" --locked --features cli
      - name: Write THIRD-PARTY-NOTICES.html
        run: |
          mkdir -p dist
          cargo about generate --locked --workspace --fail -o dist/THIRD-PARTY-NOTICES.html about.hbs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plumb-search-third-party-notices
          path: dist/
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, notices]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: plumb-search-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
