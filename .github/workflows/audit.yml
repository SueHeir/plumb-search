name: Audit

# Checks the locked dependencies against the RustSec advisory database
# (https://rustsec.org): every Monday, when Cargo.lock changes on main, and
# by hand. A known vulnerability fails it; an unmaintained or yanked crate
# is only a warning in the log.
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: [Cargo.lock, tools/pir-probe/Cargo.lock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - run: cargo audit --file tools/pir-probe/Cargo.lock
