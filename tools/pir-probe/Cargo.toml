[package]
name = "plumb-pir-probe"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

# Isolate research dependencies from the shipped app and its feature graph.
[workspace]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
spiral-rs = { version = "=0.2.1-alpha.2", features = ["server"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
