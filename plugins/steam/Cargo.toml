[package]
name = "plumb-plugin-steam"
description = "A Plumb Search plugin: your Steam library, and which results you own."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plumb-plugin = { version = "0.2.0", path = "../../crates/plumb-plugin" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
