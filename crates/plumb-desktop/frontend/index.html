<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plumb Search</title>
<!-- Shown for the moment between opening the window and the node answering. -->
<style>
:root{color-scheme:light dark;--bg:#fcfcfa;--fg:#202b3d;--muted:#626d7a;--line:#e3e7eb;--accent:#294f87}
@media (prefers-color-scheme:dark){:root{--bg:#171c25;--fg:#e8edf6;--muted:#a6afbd;--line:#333b49;--accent:#a6c4ee}}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;justify-content:center;background:var(--bg);
color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{text-align:center;padding:1rem}
h1{margin:.75rem 0 0;font-size:1.6rem;font-weight:500;letter-spacing:-.04em}
img{width:64px;height:64px}
p{margin:.5rem 0 0;color:var(--muted)}
.spinner{width:1.5rem;height:1.5rem;margin:1.5rem auto 0;border:3px solid var(--line);
border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:4s}}
</style>
</head>
<body>
<main>
<img src="brand.svg" alt="">
<h1>Plumb</h1>
<p>Starting&hellip;</p>
<div class="spinner" role="progressbar" aria-label="Starting"></div>
</main>
</body>
</html>
