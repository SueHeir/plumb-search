[package]
name = "plumb-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "plumb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
plumb-core = { version = "0.1.0", path = "../plumb-core" }
plumb-crawl = { version = "0.1.0", path = "../plumb-crawl" }
plumb-embed = { version = "0.1.0", path = "../plumb-embed" }
plumb-index = { version = "0.1.0", path = "../plumb-index" }
plumb-net = { version = "0.1.0", path = "../plumb-net" }
plumb-ingest = { version = "0.1.0", path = "../plumb-ingest" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
plumb-private = { version = "0.1.0", path = "../plumb-private" }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
