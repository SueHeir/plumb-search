[package]
name = "plumb-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "plumb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.3.4"
plumb-answer = { version = "0.1.0", path = "../plumb-answer" }
plumb-core = { version = "0.1.0", path = "../plumb-core" }
plumb-crawl = { version = "0.1.0", path = "../plumb-crawl" }
plumb-embed = { version = "0.1.0", path = "../plumb-embed" }
plumb-index = { version = "0.1.0", path = "../plumb-index" }
plumb-net = { version = "0.1.0", path = "../plumb-net" }
plumb-ingest = { version = "0.1.0", path = "../plumb-ingest" }
plumb-plugin = { version = "0.1.0", path = "../plumb-plugin" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rcgen = "0.13.2"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
flate2 = "1.1.10"
sha2 = "0.10.9"
subtle = "2.6.1"
sys-locale = "0.3.2"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
wasmi = "2.0.0"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process", "fs"] }

[dev-dependencies]
plumb-private = { version = "0.1.0", path = "../plumb-private" }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
