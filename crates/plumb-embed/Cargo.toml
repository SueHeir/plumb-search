[package]
name = "plumb-embed"
description = "Embeddings of site text for search by meaning, the same on every Plumb node."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
plumb-core = { version = "0.2.0", path = "../plumb-core" }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
unicode-normalization = "0.1.24"
ureq = { version = "3.4.2", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
