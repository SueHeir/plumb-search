[package]
name = "plumb-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fastembed = { version = "7.1.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
plumb-core = { version = "0.1.0", path = "../plumb-core" }
plumb-crawl = { version = "0.1.0", path = "../plumb-crawl" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
url = "2.5.8"
