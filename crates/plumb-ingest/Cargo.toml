[package]
name = "plumb-ingest"
description = "Loads the public seed datasets (Tranco, Common Crawl, Wikidata) into Plumb Search site records."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1.10"
httpdate = "1.0.3"
plumb-core = { version = "0.3.1", path = "../plumb-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
url = "2.5.8"
zip = "8.6.0"

[dev-dependencies]
tempfile = "3.27.0"
