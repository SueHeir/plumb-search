[package]
name = "plumb-crawl"
description = "Polite homepage crawler for Plumb Search: one page per domain, after robots.txt."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1.10"
futures = "0.3.34"
html5ever = "0.39.0"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp", "bmp"] }
plumb-core = { version = "0.1.0", path = "../plumb-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
texting_robots = "0.2.2"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
url = "2.5.8"
yake-rust = { version = "1.0.3", default-features = false, features = ["en"] }

[dev-dependencies]
axum = "0.8.9"
# The node turns on regex-automata's full DFAs (through tracing-subscriber's
# env-filter), which make robots.txt rules take more memory. Turn them on
# here too, so the robots.txt memory test measures what the node runs.
regex-automata = { version = "0.4.18", default-features = false, features = ["dfa-build", "dfa-search"] }
