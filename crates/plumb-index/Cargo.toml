[package]
name = "plumb-index"
description = "The local Plumb Search index: Tantivy over site records, ranked for navigational queries."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
stable_deref_trait = "1.2.1"
idna = "1.1.0"
levenshtein_automata = "0.2.1"
plumb-core = { version = "0.2.1", path = "../plumb-core" }
plumb-format = { path = "../plumb-format" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tantivy = "0.26.2"
tantivy-fst = "0.5.0"
unicode-normalization = "0.1.24"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3.27.0"
